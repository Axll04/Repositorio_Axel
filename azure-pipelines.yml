trigger:
  - main

pool:
  vmImage: 'windows-2022'

stages:

# 1. ETAPA DE PREPARACIÓN
- stage: Build
  displayName: 'Preparar portafolio HTML'
  jobs:
  - job: BuildJob
    displayName: 'Crear paquete del portafolio'
    steps:
    - task: ArchiveFiles@2
      displayName: 'Crear ZIP del portafolio'
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)/portafolioPersonal'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/portafolio.zip'
        replaceExistingArchive: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publicar artefacto ZIP'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/portafolio.zip'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# 2. ETAPA DE DESPLIEGUE
- stage: Deploy
  displayName: 'Desplegar portafolio en Azure'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployJob
    displayName: 'Publicar en Azure App Service'
    steps:
    - task: DownloadBuildArtifacts@0
      displayName: 'Descargar ZIP'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: AzureWebApp@1
      displayName: 'Desplegar portafolio HTML'
      inputs:
        azureSubscription: 'ConexionAxel'
        appType: 'webApp'
        appName: 'PortafolioAxelito'
        package: '$(System.ArtifactsDirectory)/drop/portafolio.zip'