
trigger:
  - main

pool:
  vmImage: 'windows-2022'

variables:
  buildConfiguration: 'Release'

stages:
- stage: Build
  displayName: 'Compilación y Publicación'
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    - task: DotNetCoreCLI@2
      displayName: 'Publicar proyecto MVC'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'PortafolioWeb/PortafolioWeb.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish'
        zipAfterPublish: false

    - task: ArchiveFiles@2
      displayName: 'Crear ZIP'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/portafolio.zip'
        replaceExistingArchive: true

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/portafolio.zip'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: Deploy
  displayName: 'Despliegue a Azure App Service'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployJob
    steps:
    - task: DownloadBuildArtifacts@0
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: AzureWebApp@1
      displayName: 'Desplegar portafolio en Azure'
      inputs:
        azureSubscription: 'ConexionAxel'
        appType: 'webAppLinux'
        appName: 'PortafolioAxelito'
        package: '$(System.ArtifactsDirectory)/drop/*.zip'
        runtimeStack: 'DOTNETCORE|8.0'
        startUpCommand: 'dotnet PortafolioWeb.dll'

